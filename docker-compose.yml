# Whole FieldShift stack: PostgreSQL, .NET backend, Flutter web frontend.
#
#   docker compose up --build
#
# Frontend: http://localhost:8080
# Backend:  http://localhost:5066
# Database: localhost:5432 (fieldshift / fieldshift)
#
# Host ports can be changed with DB_PORT, BACKEND_PORT and FRONTEND_PORT
# (e.g. DB_PORT=5433 when the run.sh database container already uses 5432).
# BACKEND_PORT is baked into the frontend build, so rebuild after changing it.

name: fieldshift

services:
  db:
    build: db
    environment:
      POSTGRES_PASSWORD: fieldshift
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - fieldshift-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: FieldShift
    environment:
      ConnectionStrings__Prices: "Host=db;Port=5432;Database=fieldshift;Username=fieldshift;Password=fieldshift"
      # appsettings.json also names FieldData (provider cache: soil map, SoilGrids, NASA data) on localhost, which
      # inside the container is the container itself: point it at the database service too.
      ConnectionStrings__FieldData: "Host=db;Port=5432;Database=fieldshift;Username=fieldshift;Password=fieldshift"
      # POST /api/auth/test-login (shared "test" account, no password). Local stack only.
      Accounts__TestLogin: ${TEST_LOGIN:-true}
      # NASA Earthdata user token (IMERG rain, SMAP soil) from the host environment or the git-ignored .env file.
      Earthdata__Token: ${EARTHDATA_TOKEN:-}
    ports:
      - "${BACKEND_PORT:-5066}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args:
        # The browser calls the backend directly, so this is the host-side address.
        API_BASE_URL: http://localhost:${BACKEND_PORT:-5066}
        # "Test sign-in" button; matches Accounts__TestLogin of the backend.
        TEST_LOGIN: ${TEST_LOGIN:-true}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fieldshift-db-data:
