server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always fetch a fresh index.html / service worker so new builds show up.
    location ~* (index\.html|flutter_service_worker\.js|flutter_bootstrap\.js)$ {
        add_header Cache-Control "no-cache";
    }
}
